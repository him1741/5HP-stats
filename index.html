<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>5HP Alliance Stats</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: slim brand bar → season heading → rank filter + tabs → one section per tab (title, formula panel, season calendar, ledger table). Dark only. */
:root {
  --bg: #0f1226;
  --bar: #151a33;
  --panel: #161b36;
  --panel-2: #1c2244;
  --line: #2a3160;
  --ink: #eef0fa;
  --ink-2: #b9bfdc;
  --muted: #8a91b8;
  --violet: #a99cf5;
  --violet-strong: #8a78f0;
  --cyan: #7fd3f7;
  --chip: #1d2a55;
  --chip-line: #3b5bb5;
  --chip-ink: #9ec3ff;
  --gold: #f6c94c; --silver: #d9dde8; --bronze: #ef8a3c;
  --r5-bg: #3a2463; --r5: #d0b4ff;
  --r4-bg: #1d3566; --r4: #8fbaff;
  --r3-bg: #183d2c; --r3: #7fdc9f;
  --r2-bg: #173a40; --r2: #7fd6d6;
  --r1-bg: #2a2f45; --r1: #b9bfd6;
  --day-on: #1f5a34; --day-on-line: #3fa765; --day-on-ink: #c9f5d7;
  --day-off: #1a1f3a; --today: #f6c94c;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }

/* Brand bar */
.topbar { background: var(--bar); border-bottom: 1px solid var(--line); }
.topbar .wrap { padding-block: 14px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.brand b { display: block; font-size: 20px; font-weight: 600; color: var(--cyan); letter-spacing: .02em; line-height: 1.1; }
.brand span { display: block; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
#google_translate_element { min-height: 28px; }
#google_translate_element select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: 15px var(--font); }
.goog-te-gadget { color: var(--muted) !important; font-size: 0 !important; }
.goog-te-gadget > span { display: none; }

/* Season heading */
.head { padding-block: 22px 0; }
.head h1 { margin: 0; font-size: clamp(26px, 5vw, 32px); font-weight: 700; line-height: 1.15; text-wrap: balance; }
.head h1 small { font-size: 17px; font-weight: 400; color: var(--ink-2); margin-left: 10px; white-space: nowrap; }
.meta { margin-top: 6px; color: var(--muted); font-size: 14.5px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.meta b { color: var(--ink-2); font-weight: 600; }
.demo { margin-top: 14px; padding: 10px 14px; border: 1px solid #6b5a1e; background: #2a2410; color: #f3e3a8; border-radius: 10px; font-size: 14.5px; }

/* Filters + tabs */
.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-top: 20px; }
.show { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.show > span { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin-right: 4px; }
.chip { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; min-width: 50px; padding: 5px 12px; font: 600 15px/1.2 var(--font); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--chip); border-color: var(--chip-line); color: var(--chip-ink); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 22px; border-bottom: 1px solid var(--line); }
@media (min-width: 1024px) { .tabs { justify-content: space-between; } }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 2px; font: 600 14px/1.2 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--violet); cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--violet-strong); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* Section */
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-top: 26px; }
.section-head h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #dcd6ff; }
.section-head .refresh { font-size: 14px; font-style: italic; color: var(--muted); }
.counting { margin: 4px 0 0; color: var(--ink-2); font-size: 15px; }
.formula { margin-top: 16px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 14px 16px; }
.formula code { display: block; font: 600 16px/1.4 var(--mono); color: var(--cyan); margin-bottom: 6px; }
.formula p { margin: 0; color: var(--ink-2); font-size: 15px; }
.formula code.second { margin-top: 14px; }
.ctl-right { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; max-width: 370px; justify-content: flex-end; }
.search { display: block; flex: 1 1 220px; max-width: 320px; }
.export { position: relative; flex: none; }
.export-btn { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--chip-ink); cursor: pointer; }
.export-btn:hover, .export-btn[aria-expanded="true"] { border-color: var(--chip-line); background: var(--chip); }
.export-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 15; width: 260px; background: var(--panel); border: 1px solid var(--chip-line); border-radius: 10px; padding: 8px; box-shadow: 0 10px 30px rgb(0 0 0 / .45); }
.em-title { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--violet); padding: 4px 8px 6px; text-transform: uppercase; }
.export-menu button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 15px; color: var(--ink); }
.export-menu button small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.export-menu button:hover, .export-menu button:focus-visible { background: var(--panel-2); }
.search input { width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: 16px var(--font); }
.search input::placeholder { color: var(--muted); }

/* Season calendar */
.cal { margin-top: 18px; }
.cal-title { font-size: 15.5px; color: var(--ink); margin-bottom: 10px; }
.cal-title b { color: var(--day-on-ink); }
.cal-row { display: grid; grid-template-columns: minmax(0, 190px) auto; align-items: center; gap: 10px; margin-bottom: 7px; }
.cal-row > span { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--violet); }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.day { width: 34px; height: 30px; display: grid; place-items: center; border-radius: 6px; font-size: 14px; font-variant-numeric: tabular-nums; border: 1px solid var(--line); color: var(--muted); background: var(--day-off); }
.day.on { background: var(--day-on); border-color: var(--day-on-line); color: var(--day-on-ink); }
.day.future { background: transparent; border-style: dashed; }
.day[data-day] { cursor: pointer; user-select: none; }
.day[data-day]:hover { filter: brightness(1.25); }
.day.off { background: transparent; border-color: #b4505a; border-style: dashed; color: #d98a92; text-decoration: line-through; }
.cal-note { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
.cal-reset { font: inherit; font-size: 13px; margin-left: 10px; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--day-off); color: var(--ink); cursor: pointer; }
.day.today { outline: 2px solid var(--today); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1px solid var(--line); background: var(--day-off); }
.legend i.on { background: var(--day-on); border-color: var(--day-on-line); }
.legend i.off { background: transparent; border: 1px dashed #b4505a; }
@media (max-width: 560px) { .cal-row { grid-template-columns: 1fr; gap: 4px; } }

/* Table */
.table-box { margin-top: 18px; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 13px 12px; text-align: left; white-space: nowrap; }
th { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--violet); background: var(--panel-2); border-bottom: 1px solid var(--line); }
th button { all: unset; cursor: pointer; }
th[aria-sort="descending"] button::after { content: " ▼"; font-size: 10px; }
th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 10px; }
td { font-size: 16px; color: var(--ink); }
tbody tr + tr { border-top: 1px solid var(--line); }
tbody tr:hover { background: var(--panel-2); }
td.pos { width: 1%; color: var(--ink-2); }
.medal { display: block; font-size: 17px; line-height: 1; margin-bottom: 2px; }
tr.gold .name-btn, tr.gold .pw { color: var(--gold); }
tr.silver .name-btn, tr.silver .pw { color: var(--silver); }
tr.bronze .name-btn, tr.bronze .pw { color: var(--bronze); }
.rank { display: inline-block; min-width: 34px; text-align: center; font-size: 13px; font-weight: 700; line-height: 1; padding: 5px 7px; border-radius: 5px; }
.rank.R5 { background: var(--r5-bg); color: var(--r5); } .rank.R4 { background: var(--r4-bg); color: var(--r4); }
.rank.R3 { background: var(--r3-bg); color: var(--r3); } .rank.R2 { background: var(--r2-bg); color: var(--r2); }
.rank.R1 { background: var(--r1-bg); color: var(--r1); }
.name-btn { all: unset; cursor: pointer; font-weight: 500; }
.days-mini, .seen-mini { display: none; }
.growth, .days-cell, .dmg-cell { font-variant-numeric: tabular-nums; }
.weeks { display: grid; gap: 10px; margin-top: 4px; }
.wk { display: grid; grid-template-columns: 84px minmax(0, 1fr) 118px; align-items: center; gap: 12px; font-size: 14.5px; }
.wk > span:first-child { color: var(--ink-2); }
.wk > span:last-child { text-align: right; }
.wk b { font-weight: 600; font-variant-numeric: tabular-nums; }
.wk small { display: block; color: var(--muted); font-size: 12.5px; }
.wk .bar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.wk .bar i { display: block; height: 100%; background: var(--violet-strong); border-radius: 4px; }
.wk.future { color: var(--muted); }
.wk.future > span:last-child { font-size: 13px; }
.drawer .note.best { margin: 10px 0 0; }
.drawer .note.best b { color: var(--ink); }
.rank.mini { display: none; }
.name-btn:hover { text-decoration: underline; }
.dmg { color: var(--muted); margin-left: 6px; }
.seen-ok { color: var(--r3); } .seen-warn { color: #f0b45a; } .seen-bad { color: #ff8a80; }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); white-space: normal; }
@media (max-width: 440px) {
  #table:not([data-view="roster"]) th { font-size: 10px; letter-spacing: 0; }
  #table .dmg-cell { font-size: 13px; }
  #table:not([data-view="roster"]) .name-btn { display: inline-block; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
}
@media (max-width: 400px) {
  .table-box th, .table-box td { padding: 10px 4px; }
  .table-box th:first-child, .table-box td:first-child { padding-left: 9px; }
  .table-box td { font-size: 14px; }
  .table-box th { font-size: 10.5px; letter-spacing: .02em; }
  .table-box .dmg { font-size: 11.5px; }
  .table-box .rank.mini { margin-right: 4px; }
}
@media (min-width: 881px) and (max-width: 940px) {
  th, td { padding: 12px 10px; }
  th:nth-child(2), td:nth-child(2) { display: none; }
  .rank.mini { display: inline-block; min-width: 0; font-size: 11px; padding: 3px 5px; margin-right: 8px; vertical-align: 1px; }
}
@media (max-width: 880px) {
  th, td { padding: 11px 5px; }
  .rank { min-width: 30px; padding: 5px 5px; }
  th { font-size: 11.5px; letter-spacing: .04em; }
  td { font-size: 15px; }
  th:first-child, td:first-child { padding-left: 12px; }
  .dmg { display: block; margin: 0; font-size: 12px; letter-spacing: -.01em; }
  .pos .medal { font-size: 17px; margin: 0; }
  .pos .medal + .n { display: none; }
  th:nth-child(2), td:nth-child(2) { display: none; }
  #table:not([data-view="roster"]) th:nth-child(4), #table:not([data-view="roster"]) td:nth-child(4) { display: none; }
  #table[data-view="season"] th:nth-child(8), #table[data-view="season"] td:nth-child(8), #table[data-view="last"] th:nth-child(8), #table[data-view="last"] td:nth-child(8) { display: none; }
  #table[data-view="season"] .days-mini, #table[data-view="last"] .days-mini, #table[data-view="roster"] .seen-mini { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  #table[data-view="roster"] th:nth-child(6), #table[data-view="roster"] td:nth-child(6) { display: none; }
  .rank.mini { display: inline-block; min-width: 0; font-size: 11px; padding: 3px 4px; margin-right: 6px; vertical-align: 1px; }
  th { white-space: normal; vertical-align: bottom; }
  .tabs { gap: 0 18px; }
}
footer { color: var(--muted); font-size: 14px; padding-block: 26px 36px; }
footer a { color: var(--ink-2); }

/* Player panel */
.scrim { position: fixed; inset: 0; background: rgb(4 6 16 / .6); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 21; overflow-y: auto;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 20px; }
.drawer h2 { margin: 0 44px 0 0; font-size: 26px; line-height: 1.15; overflow-wrap: anywhere; }
.drawer .x { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 8px; width: 36px; height: 36px; font-size: 20px; cursor: pointer; }
.drawer .sub { color: var(--ink-2); font-size: 15px; margin: 8px 0 0; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin: 18px 0 4px; }
.kv div { min-width: 0; }
.kv label { display: block; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--violet); }
.kv span { font-size: 19px; font-weight: 600; }
.kv small { display: block; color: var(--muted); font-size: 13.5px; }
.chart-title { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--violet); margin: 22px 0 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--font); }
.drawer .note { color: var(--muted); font-size: 14.5px; }
.drawer a { color: var(--chip-ink); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
[hidden] { display: none !important; }
/* Season highlights */
.hl { display: flex; flex-direction: column; gap: 20px; margin-top: 18px; }
.hl-band { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px 32px; }
.hl-intro { flex: 1 1 220px; align-self: center; min-width: 0; }
.hl-emoji { font-size: 44px; line-height: 1; }
.hl-intro h3 { margin: 12px 0 0; font-size: 21px; letter-spacing: .05em; text-transform: uppercase; }
.hl-intro p { margin: 4px 0 0; font-size: 14.5px; color: var(--muted); }
.hl-intro p.total { margin-top: 12px; font-size: 14px; color: var(--ink-2); }
.podium { flex: 3 1 440px; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
.pod { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-width: 0; }
.pod .medal-big { font-size: 32px; line-height: 1; }
.pod .name-btn { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; font-weight: 700; }
.pod.p1 .name-btn { font-size: 20px; color: var(--gold); }
.pod.p2 .name-btn { color: var(--silver); }
.pod.p3 .name-btn { color: var(--bronze); }
.pod .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pod.empty .val { color: var(--muted); }
.step { width: 100%; margin-top: 6px; border-radius: 10px 10px 0 0; display: grid; place-items: center; font-size: 15px; font-weight: 800; letter-spacing: .1em; border: 1px solid var(--line); border-bottom: 0; }
.pod.p1 .step { height: 132px; color: var(--gold); }
.pod.p2 .step { height: 100px; color: var(--silver); }
.pod.p3 .step { height: 78px; color: var(--bronze); }
.hl-band.hl-dmg .step { background: rgb(255 138 92 / .16); }
.hl-band.hl-grow .step { background: rgb(127 220 159 / .14); }
.hl-band.hl-champ .step { background: rgb(169 156 245 / .16); }
.hl-rest { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 8px; align-self: center; }
.hl-rest .lbl { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--violet); }
.hl-rest .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14.5px; }
.hl-rest .row > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hl-rest .row .p { color: var(--muted); margin-right: 4px; }
.hl-rest .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.hl-wins { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.hl-wins-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.hl-wins-head > div:first-child { display: flex; align-items: center; gap: 16px; }
.hl-wins-head h3 { margin: 0; font-size: 21px; letter-spacing: .05em; }
.hl-wins-head p { margin: 4px 0 0; font-size: 14.5px; color: var(--muted); }
.hl-count { text-align: right; }
.hl-count b { display: block; font-size: 40px; font-weight: 800; color: var(--gold); line-height: 1; }
.hl-count span { font-size: 13px; color: var(--muted); }
.wins { display: flex; flex-wrap: wrap; gap: 10px; }
.win { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; font-size: 18px; border: 1px solid var(--line); background: var(--panel-2); }
.win.latest { border-color: var(--gold); background: rgb(246 201 76 / .10); }
.win b { font-size: 15px; font-weight: 700; color: var(--gold); }
.win small { display: block; font-size: 12.5px; color: var(--ink-2); }
@media (max-width: 560px) {
  .hl-band, .hl-wins { padding: 18px; }
  .hl-emoji { font-size: 36px; }
  .podium { gap: 8px; }
  .pod .name-btn { font-size: 14px; }
  .pod.p1 .name-btn { font-size: 16px; }
  .pod .val { font-size: 14.5px; }
  .pod .medal-big { font-size: 26px; }
  .pod.p1 .step { height: 104px; } .pod.p2 .step { height: 80px; } .pod.p3 .step { height: 62px; }
  .win { font-size: 16px; padding: 8px 12px; }
}
/* Alliance stats panel */
.astats { margin-top: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 22px 18px; display: flex; flex-wrap: wrap; gap: 14px 36px; align-items: flex-start; }
.as-grid { flex: 1 1 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 24px; align-items: end; }
.as-grid .as-main { grid-column: span 2; padding-bottom: 12px; }
.as-main { min-width: 0; }
.as-top { flex: 1 1 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 4px 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.as-eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--violet); }
.as-top h1 { margin: 4px 0 0; font-size: 22px; font-weight: 700; line-height: 1.2; }

<body>
<!--ARTIFACT-BODY-START-->

    <div id="astats-box"><p class="meta" id="updated">Loading…</p></div>
    <div class="demo" id="demo-banner" hidden>Preview: the roster is real (pulled Oct 22). Daily and season damage are simulated so you can see how the tables fill in once tracking runs.</div>

      <button class="chip" data-rank="R2" aria-pressed="true">R2</button>
      <button class="chip" data-rank="R1" aria-pressed="true">R1</button>
    </div>
    <div class="ctl-right">
      <label class="search"><input id="q" type="search" placeholder="Find a player" aria-label="Find a player"></label>
      <div class="export">
        <button class="export-btn" id="export-btn" aria-label="Export CSV" aria-haspopup="true" aria-expanded="false" title="Export CSV">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><polyline points="7 10 12 15 17 10"></polyline><path d="M5 21h14"></path></svg>
        </button>
        <div class="export-menu" id="export-menu" role="menu" hidden>
          <div class="em-title">Export CSV</div>
          <button role="menuitem" data-export="view">This view<small>The table as shown, with your filters, search and sort</small></button>

<footer class="wrap">
  Data from <a href="https://kg.dbapp.ru/" target="_blank" rel="noopener">KG Companion</a>. Days run 00:00–24:00 UTC. Tap a player's name for their history.
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="p-name"></aside>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const RANKS = ['R5', 'R4', 'R3', 'R2', 'R1'];
  const store = {
    get(k, d) { try { const v = localStorage.getItem('kgstats:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('kgstats:' + k, JSON.stringify(v)); } catch {} },
  };

  // ---------- formatting ----------
  const SUF = [[1e18, 'Qi'], [1e15, 'Qa'], [1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  const compact = (n, dp = 2) => {
    if (n == null || !isFinite(n)) return '—';
    const a = Math.abs(n);
    for (const [v, s] of SUF) if (a >= v) return (n / v).toFixed(a / v >= 100 ? 1 : dp) + s;
    return Math.round(n).toLocaleString();
  };
  const tNum = (n) => (n / 1e12).toFixed(2);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ago = (iso) => {
    const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60); if (h < 48) return h + ' h ago';
    return Math.round(h / 24) + ' days ago';
  };
  const utcStamp = (iso) => iso.slice(0, 16).replace('T', ' ') + ' UTC';
  const fmtDate = (d) => d ? new Date(d + (d.length === 10 ? 'T00:00:00Z' : '')).toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' }) : '—';
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400e3);
  const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 86400e3).toISOString().slice(0, 10);

  // ---------- state ----------
  let data = { latest: null, history: null, changes: [], prev: null };
  let view = 'roster';
  const ranks = new Set(store.get('ranks', RANKS));
  let query = '';
  const sorts = store.get('sorts3', {});

  const bust = () => '?t=' + Math.floor(Date.now() / 60000);
  const getJson = async (f, d) => { try { const r = await fetch('data/' + f + bust()); if (!r.ok) return d; return await r.json(); } catch { return d; } };

  async function load() {
    const [latest, history, changes, prev] = await Promise.all([
      getJson('latest.json', null), getJson('history.json', null), getJson('changes.json', []), getJson('prev-season.json', null),
    ]);
    if (!latest) { $('#updated').textContent = 'No data yet. The first update runs within 15 minutes of setup.'; return; }
    data = { latest, history, changes: changes || [], prev };
    loadExcluded();
    renderHeader(); render();
  }

  function renderHeader() {
    const L = data.latest, A = L.alliance, S = L.season;
    $('#brand-tag').textContent = A.tag;
    $('#brand-sub').textContent = `Stats · KG ${A.server}`;
    document.title = `${A.tag} Alliance Stats`;
    $('#demo-banner').hidden = !L.demo;
  }

  // ---------- pieces ----------
  const rankCell = (r) => `<span class="rank ${esc(r)}">${esc(r || '—')}</span>`;
  const nameCell = (x) => `<span class="rank mini ${esc(x.rank)}">${esc(x.rank)}</span><button class="name-btn" data-id="${x.id}">${esc(x.name)}</button>`;
  const powerCell = (x) => `<span class="pw">${tNum(x.power)}T</span>`;
  const fmtScore = (s) => (s ?? 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtT = (n) => ((n ?? 0) / 1e12).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + 'T';
  const scoreCell = (s, d) => `<b>${fmtScore(s)}</b><span class="dmg">(${fmtT(d)})</span>`;
  // Adjusted score: damage ÷ max power^k (both in T). k is re-measured by the tracker each season so account size has no overall effect.
  const adjExp = () => data.latest?.adjusted?.exponent ?? 1.4;
  // Alts are every R1. An alt counts in rankings only once it has dealt PvP damage in that period.
  const isAlt = (x) => (data.latest?.adjusted?.excludeRanks ?? ['R1']).includes(x.rank);
  const adjMinT = () => data.latest?.adjusted?.minPowerT ?? 1;
  // Adjusted score; null (shown as —) under the size minimum, or for an alt with no damage.
  const adjusted = (dmg, maxPower, rank) => {
    if (!(maxPower >= adjMinT() * 1e12)) return null;
    if (isAlt({ rank }) && !(dmg > 0)) return null;
    return (dmg / 1e12) / Math.pow(maxPower / 1e12, adjExp());
  };
  const fmtAdj = (v) => v == null ? '—' : v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const adjNote = () => {
    const a = data.latest?.adjusted || {};
    const when = a.basedOn ? `Last re-measured on ${fmtDate(a.computedOn)} from Season ${a.basedOn} (${a.players} players).` : 'Set from Seasons 32 and 33.';
    return `${when} Re-measured on day ${a.recalcDay ?? 8} of every season from the season that just finished.`;
  };
  const adjCol = (dmgOf, maxOf) => ({ key: 'adj', label: 'Adjusted', get: (x) => adjusted(dmgOf(x), maxOf(x), x.rank) ?? -1, cell: (x) => `<b>${fmtAdj(adjusted(dmgOf(x), maxOf(x), x.rank))}</b>` });
  const seen = (d) => d == null ? '—' : d === 0 ? '<span class="seen-ok">Today</span>' : d < 3 ? `<span class="seen-ok">${d}d ago</span>` : d < 7 ? `<span class="seen-warn">${d}d ago</span>` : `<span class="seen-bad">${d}d ago</span>`;
  const formulaBox = () => `<details class="howto"><summary>How the scores work</summary><div class="howto-body">
    <p><b>Activity</b> = PvP damage ÷ max power. The same score the game and KG Companion use: a higher score means more fighting for the account's size.</p>
    <p><b>Adjusted</b> = PvP damage ÷ max power<sup>${adjExp()}</sup>. In this alliance bigger accounts deal more than proportionally more damage, so even Activity ranks them higher. Using the ${adjExp()} power instead removes that edge, so big and small accounts spread evenly through the rankings and what's left is how hard each player fought for their size. ${adjNote()} The exponent is measured from main accounts only, since some alts are big enough to skew it. Accounts under ${adjMinT()}T max power show — and aren't ranked by Adjusted.</p>
    <p>Alts (R1) appear in the leaderboards and rankings only once they've dealt PvP damage in that period.</p>
    <p>Damage and power are in T. Click a column heading to sort by it.</p></div></details>`;

  // ---------- excluded days (this browser only) ----------
  // Tap a counted day in the calendar to leave it out of the season totals. Per-day damage comes from history.json
  // (checked against the tracker's own season totals), plus today's running damage.
  const exclKey = () => 'excl:' + (data.latest?.season?.number ?? 0);
  let excluded = new Set();
  const loadExcluded = () => {
    const S = data.latest?.season, ok = new Set(S?.daysCounted || []);
    excluded = new Set((store.get(exclKey(), []) || []).filter((d) => ok.has(d)));
    seasonCache = new Map();
  };
  let seasonCache = new Map();
  function seasonOf(x) {
    if (!excluded.size) return { dmg: x.seasonDmg, score: x.seasonScore };
    let r = seasonCache.get(x.id);
    if (r) return r;
    const H = data.history, S = data.latest.season, today = data.latest.gameDay;
    const h = H?.players?.[String(x.id)], days = H?.days || [];
    let dmg = excluded.has(today) ? 0 : (x.dailyDmg || 0);
    if (h) {
      const off = days.length - h.d.length;
      for (let i = 0; i < days.length; i++) {
        const d = days[i];
        if (d < S.countingFrom || d < S.startedOn || excluded.has(d)) continue;
        dmg += h.d[i - off] || 0;
      }
    }
    r = { dmg, score: x.maxPower > 0 ? Math.round(dmg / x.maxPower * 100) / 100 : 0 };
    seasonCache.set(x.id, r);
    return r;
  }

  // ---------- per-player breakdowns from daily history ----------
  const histOf = (id) => data.history?.players?.[String(id)];
  // date -> damage for one player (history plus today's running total)
  function dmgByDate(id, x) {
    const h = histOf(id), days = data.history?.days || [], m = new Map();
    if (h) { const off = days.length - h.d.length; days.forEach((d, i) => { const v = h.d[i - off]; if (v != null) m.set(d, v); }); }
    if (x && x.dailyDmg != null) m.set(data.latest.gameDay, x.dailyDmg);
    return m;
  }
  // dates of a season that count (not before tracking, not left out, not in the future)
  function seasonDates(start, length, opts = {}) {
    const today = data.latest.gameDay, out = [];
    for (let i = 0; i < length; i++) {
      const d = addDays(start, i);
      if (d > today) break;
      if (opts.current && (d < data.latest.season.countingFrom || excluded.has(d))) continue;
      out.push(d);
    }
    return out;
  }
  // days with any damage: { n, of }
  let foughtCache = new Map(), foughtKey = '';
  function fought(x, which = 'current') {
    const key = which + '|' + [...excluded].sort().join(',');
    if (key !== foughtKey) { foughtCache = new Map(); foughtKey = key; }
    if (foughtCache.has(x.id)) return foughtCache.get(x.id);
    let dates;
    if (which === 'current') { const S = data.latest.season; dates = S.startedOn ? seasonDates(S.startedOn, S.length || 28, { current: true }) : []; }
    else { const P = data.prev; dates = seasonDates(P.from, daysBetween(P.from, P.to) + 1); }
    const dm = dmgByDate(x.id, which === 'current' ? x : null);
    const r = { n: dates.filter((d) => (dm.get(d) || 0) > 0).length, of: dates.length };
    foughtCache.set(x.id, r);
    return r;
  }
  const foughtTxt = (f) => `${f.n}/${f.of}`;
  const foughtCol = (which) => ({ key: 'days', label: 'Days fought', get: (x) => fought(x, which).n, cell: (x) => `<span class="days-cell">${foughtTxt(fought(x, which))}</span>` });
  const nameWithDays = (which) => (x) => nameCell(x) + `<span class="days-mini">${foughtTxt(fought(x, which))} days</span>`;
  // max power gained since the season started (T); null if unknown
  function growth(x) {
    const S = data.latest.season, h = histOf(x.id), days = data.history?.days || [];
    if (!h || !S.startedOn) return null;
    const off = days.length - h.p.length;
    let before = null, firstIn = null;
    for (let i = 0; i < days.length; i++) {
      const v = h.p[i - off]; if (v == null) continue;
      if (days[i] < S.startedOn) before = v; else if (firstIn == null) firstIn = v;
    }
    const startP = before ?? firstIn;
    return startP == null ? null : (x.maxPower - startP) / 1e12;
  }
  const fmtGrowth = (g) => g == null ? '—' : (g >= 0 ? '+' : '−') + Math.abs(g).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function calendar() {
    const S = data.latest.season;
    if (!S.startedOn) return '';
    const today = data.latest.gameDay, counted = new Set(S.daysCounted || []);
    const rows = [];
    for (let w = 0; w * 7 < S.length; w++) {
      const days = [];
      for (let i = w * 7; i < Math.min(S.length, w * 7 + 7); i++) {
        const d = addDays(S.startedOn, i);
        const cls = d > today ? 'future' : counted.has(d) ? (excluded.has(d) ? 'off' : 'on') : '';
        const tap = counted.has(d) ? ` data-day="${d}" role="button" tabindex="0"` : '';
        days.push(`<span class="day ${cls}${d === today ? ' today' : ''}" title="${fmtDate(d)}${counted.has(d) ? (excluded.has(d) ? ' — excluded (tap to count)' : ' — tap to exclude') : ''}"${tap}>${Number(d.slice(8))}</span>`);
      }
      const label = w === 0 ? `Rest week (days 1–7)` : `Week ${w} (days ${w * 7 + 1}–${w * 7 + 7})`;
      rows.push(`<div class="cal-row"><span>${label}</span><div class="days">${days.join('')}</div></div>`);
    }
    const n = counted.size - excluded.size, sofar = S.dayNumber || 0;
    const note = excluded.size ? `<div class="cal-note">${excluded.size} day${excluded.size === 1 ? '' : 's'} left out of the totals below. Saved in this browser only.<button class="cal-reset" data-reset>Count all days</button></div>` : '<div class="cal-note">Tap a day to leave it out of the season totals.</div>';
    return `<div class="cal"><div class="cal-title">📅 <b>${n} of ${sofar}</b> days counted this season</div>${note}${rows.join('')}
      <div class="legend"><span><i class="on"></i>Counted</span><span><i class="off"></i>Excluded</span><span><i></i>Before tracking began</span><span>Gold outline = today</span></div></div>`;
  }

  // ---------- views ----------
  const base = [
    { key: 'rank', label: 'Rank', get: (x) => RANKS.indexOf(x.rank), cell: (x) => rankCell(x.rank) },

  const VIEWS = {

    calendar: {

    },
    highlights: {

      def: 'score', medals: true,

  // ---------- alliance stats (Season leaderboard) ----------
  // Alts = every R1 account.
  function statsPanel() {
    const L = data.latest, M = L.members, A = L.alliance, X = L.allianceStats || {};
    const alts = M.filter(isAlt), mains = M.filter((x) => !isAlt(x));
    const sum = (arr, f) => arr.reduce((t, x) => t + (f(x) || 0), 0);
    const nowP = sum(M, (x) => x.maxPower);
    const startP = X.startPower || (nowP - sum(M, (x) => (growth(x) || 0) * 1e12));
    const gain = nowP - startP, pct = startP > 0 ? gain / startP * 100 : 0;
    const startW = nowP > 0 ? Math.max(0, Math.min(100, startP / nowP * 100)) : 100;
    const dmg = sum(M, (x) => seasonOf(x).dmg), fighters = M.filter((x) => seasonOf(x).dmg > 0).length;
    const avg = (arr) => arr.length ? sum(arr, (x) => x.maxPower) / arr.length : 0;
    const T = (v, dp = 1) => (v / 1e12).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp }) + 'T';
    const item = (label, value, sub, cls = '') => `<div class="as-item ${cls}"><div class="as-label">${label}</div><div class="as-row"><span class="as-val">${value}</span><span class="as-sub">${sub}</span></div></div>`;

        <div>
          <div class="as-eyebrow">[${esc(A.tag)}] ${esc(A.name)} · Alliance stats</div>
          <h1>Season ${S.number ?? '—'}${week ? `<small>${week}</small>` : ''}</h1>
        </div>
        <div class="as-updated">Last updated: <b>${utcStamp(L.fetchedAt)}</b><span>(${ago(L.fetchedAt)})</span></div>
      </div>
      <div class="as-grid">
        <div class="as-main">
          <div class="as-label">ALLIANCE POWER</div>
          <div class="as-big">${T(nowP)}</div>
          <div class="as-bar" aria-hidden="true"><span style="width:${startW.toFixed(1)}%"></span><span class="gain" style="width:${(100 - startW).toFixed(1)}%"></span></div>
          <div class="as-bar-labels"><span>Season start ${T(startP)}</span><span class="up">${gain >= 0 ? '+' : '−'}${T(Math.abs(gain))} (${gain >= 0 ? '+' : '−'}${Math.abs(pct).toFixed(1)}%)</span></div>
        </div>
        ${item('MEMBERS', `${A.members}${A.maxMembers ? ' / ' + A.maxMembers : ''}`, 'slots filled', 'r1')}
        ${item('ACTIVE PLAYERS', X.activePlayers != null ? `${X.activePlayers} / ${X.countPlayers ?? A.members}` : '—', 'per KG Companion', 'r1')}
        ${item('SEASON DAMAGE', T(dmg), `${fighters} of ${M.length} dealt damage`)}
        ${item('AVERAGE POWER', T(avg(mains)), `main accounts (${T(avg(M))} with alts)`)}
        ${item('ALLIANCE PVP INDEX', X.pvpRate != null ? X.pvpRate.toLocaleString('en-US', { maximumFractionDigits: 2 }) : '—', 'last 3 seasons')}
        ${item('ALTS', String(alts.length), `all R1 · ${alts.filter((x) => seasonOf(x).dmg > 0).length} fought this season`)}

  // ---------- Daily PvP for any day ----------
  let dailyDate = null;   // null = today (live); otherwise a past date from the daily history
  // Season label for a date, e.g. "Season 33 · Week 2 · Day 4".
  function dayInSeason(d) {
    const S = data.latest.season, len = S.length || 28;
    if (!S.startedOn) return '';
    const diff = daysBetween(S.startedOn, d), k = Math.floor(diff / len), i = diff - k * len, w = Math.floor(i / 7);
    return `Season ${S.number + k} · ${w === 0 ? 'Rest week' : 'Week ' + w} · Day ${(i % 7) + 1}`;
  }
  // One row per player for the chosen day, shaped like a live member row.
  function dailyRows() {
    const L = data.latest;
    if (!dailyDate) return L.members;
    const H = data.history, days = H?.days || [], i = days.indexOf(dailyDate);
    if (i < 0) return [];
    const byId = new Map(L.members.map((m) => [String(m.id), m]));
    const rows = [];
    for (const [id, h] of Object.entries(H.players || {})) {
      const off = days.length - h.d.length, v = h.d[i - off];
      if (v == null) continue;
      let p = null;
      for (let k = i; k >= 0 && p == null; k--) p = h.p[k - off] ?? null;   // max power that day
      const m = byId.get(id);
      const mp = p || m?.maxPower || 0;
      rows.push({ id: Number(id), name: m?.name || h.n, rank: m?.rank || '', power: mp, maxPower: mp, dailyDmg: v, dailyScore: mp > 0 ? Math.round(v / mp * 100) / 100 : 0 });
    }
    return rows;
  }
  function dayNav() {
    const days = data.history?.days || [], today = data.latest.gameDay;
    const cur = dailyDate || today, first = days[0];
    const prev = cur > first ? `<button class="cal-pill sq" data-day-nav="-1">‹ Previous day</button>` : '';
    const next = dailyDate ? `<button class="cal-pill sq" data-day-nav="1">Next day ›</button>` : '';
    const back = dailyDate ? `<button class="cal-pill sq" data-day-nav="today" aria-pressed="true">Back to today</button>` : '';
    return `<div class="day-nav">${prev}<span class="dn-date">${dailyDate ? fmtDay(dailyDate, { weekday: 'short', month: 'short', day: 'numeric' }) : 'Today'}</span>${next}${back}</div>`;
  }
  function moveDay(step) {
    const days = data.history?.days || [], today = data.latest.gameDay;
    const target = addDays(dailyDate || today, step);
    if (target >= today) dailyDate = null;
    else if (days.length && target >= days[0]) dailyDate = target;
    render();
  }

  // ---------- activity calendar ----------
  // Alliance damage per day, from each member's daily history plus today's live numbers.
  let calSeason = null, calShade = 'dmg', calDay = null, calCache = null;
  function dayTotals() {
    if (calCache && calCache.key === data.latest.fetchedAt) return calCache.map;
    const H = data.history, days = H?.days || [], map = new Map(), today = data.latest.gameDay;
    const add = (d, id, name, v) => {
      if (!(v > 0)) return;
      let e = map.get(d); if (!e) map.set(d, (e = { dmg: 0, n: 0, list: [] }));
      e.dmg += v; e.n++; e.list.push({ id, name, v });
    };
    for (const [id, h] of Object.entries(H?.players || {})) {
      const off = days.length - h.d.length;
      days.forEach((d, i) => { if (d !== today) add(d, id, h.n, h.d[i - off]); });
    }
    for (const m of data.latest.members) add(today, String(m.id), m.name, m.dailyDmg);
    calCache = { key: data.latest.fetchedAt, map };
    return map;
  }
  // Seasons with a full set of daily data, newest first.
  function calSeasons() {
    const S = data.latest.season, first = data.history?.days?.[0], len = S.length || 28, out = [];
    if (!S.startedOn) return out;
    for (let k = 0; k < 24; k++) {
      const start = addDays(S.startedOn, -len * k);
      if (k > 0 && first && start < first) break;
      out.push({ number: S.number - k, start, len, current: k === 0 });
    }
    return out;
  }
  const fmtDay = (d, opts) => new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, { timeZone: 'UTC', ...opts });
  function calCurrent() {
    const seasons = calSeasons();
    const cur = seasons.find((x) => x.number === calSeason) || seasons[0];
    if (cur) calSeason = cur.number;
    return { seasons, cur };
  }
  function calCounting() {
    const { cur } = calCurrent();
    if (!cur) return '';
    const T = dayTotals(), today = data.latest.gameDay, end = addDays(cur.start, cur.len - 1);
    let total = 0;
    for (let i = 0; i < cur.len; i++) { const d = addDays(cur.start, i); if (d <= today) total += T.get(d)?.dmg || 0; }
    return `Season ${cur.number} · ${fmtDay(cur.start, { month: 'short', day: 'numeric' })} – ${fmtDay(end, { month: 'short', day: 'numeric' })} · ${fmtT(total)}${cur.current ? ' so far' : ' total'}`;
  }
  function calendarHTML() {
    const { seasons, cur } = calCurrent();
    if (!cur) return '<p class="note">No daily data yet.</p>';
    const T = dayTotals(), today = data.latest.gameDay;
    const days = Array.from({ length: cur.len }, (_, i) => addDays(cur.start, i));
    const past = days.filter((d) => d <= today);
    if (!calDay || !past.includes(calDay)) calDay = past.reduce((b, d) => ((T.get(d)?.dmg || 0) > (T.get(b)?.dmg || 0) ? d : b), past[0]);
    const lvDmg = (v) => (v <= 0 ? 0 : v < 1e15 ? 1 : v < 2e16 ? 2 : v < 8e16 ? 3 : v < 1.6e17 ? 4 : 5);
    const lvN = (n) => (n <= 0 ? 0 : n < 10 ? 1 : n < 30 ? 2 : n < 60 ? 3 : n < 80 ? 4 : 5);
    const pills = seasons.map((x) => `<button class="cal-pill" data-cal-season="${x.number}" aria-pressed="${x.number === cur.number}">Season ${x.number}</button>`).join('');
    const shade = ['dmg', 'n'].map((k) => `<button class="cal-pill sq" data-cal-shade="${k}" aria-pressed="${calShade === k}">${k === 'dmg' ? 'Damage' : 'Players fighting'}</button>`).join('');
    const heads = days.slice(0, 7).map((d) => `<span>${fmtDay(d, { weekday: 'short' }).toUpperCase()}</span>`).join('');
    let rows = '';
    for (let w = 0; w * 7 < cur.len; w++) {
      const wk = days.slice(w * 7, w * 7 + 7);
      const wTotal = wk.reduce((t, d) => t + (d <= today ? T.get(d)?.dmg || 0 : 0), 0);
      const label = w === 0 ? ['REST WEEK', 'Rest'] : [`WEEK ${w}`, `W${w}`];
      const cells = wk.map((d) => {
        if (d > today) return `<div class="cal-day future"><span class="cd-date">${fmtDay(d, { month: 'short', day: 'numeric' })}</span></div>`;
        const e = T.get(d) || { dmg: 0, n: 0 };

    }
    const legend = calShade === 'n' ? 'More players' : 'More damage';
    // selected day
    const i = days.indexOf(calDay), e = T.get(calDay) || { dmg: 0, n: 0, list: [] };
    const wkNo = Math.floor(i / 7);
    const MED = ['🥇', '🥈', '🥉'];
    const top3 = [...e.list].sort((a, b) => b.v - a.v).slice(0, 3)
      .map((p, k) => `<div class="cs-row"><span>${MED[k]} <button class="name-btn" data-id="${p.id}">${esc(p.name)}</button></span><b>${fmtT(p.v)}</b></div>`).join('');
    const sel = `<section class="cal-card sel-card">
      <div class="cc-label">SELECTED DAY</div>
      <div class="cs-date">${fmtDay(calDay, { weekday: 'short', month: 'short', day: 'numeric' })}</div>
      <div class="cs-sub">${wkNo === 0 ? 'Rest week' : 'Week ' + wkNo} · Day ${(i % 7) + 1}${calDay === today ? ' · today so far' : ''}</div>
      <div class="cs-nums"><div><b>${fmtT(e.dmg)}</b><span>alliance damage</span></div><div><b>${e.n}</b><span>players fought</span></div></div>
      ${top3 ? `<div class="cc-label" style="margin-top:14px">TOP THAT DAY</div><div class="cs-list">${top3}</div>` : '<p class="note">No PvP that day.</p>'}
      <button class="cal-pill sq cs-open" data-open-day="${calDay}">See every player that day ›</button>
    </section>`;
    const busiest = past.map((d) => [d, T.get(d) || { dmg: 0, n: 0 }]).filter(([, x]) => x.dmg > 0).sort((a, b) => b[1].dmg - a[1].dmg).slice(0, 5)
      .map(([d, x], k) => `<button class="cb-row" data-cal-day="${d}"><span class="p">${k + 1}</span><span>${fmtDay(d, { month: 'short', day: 'numeric' })} <small>· ${x.n} fought</small></span><b>${fmtT(x.dmg)}</b></button>`).join('');
    return `<div class="cal-controls"><div class="cal-pills" role="group" aria-label="Season">${pills}</div>
        <div class="cal-shade" role="group" aria-label="Shade days by"><span>SHADE BY:</span>${shade}</div></div>
      <div class="cal-layout">
        <div class="cal-card cal-grid-card">
          <div class="cal-row2 cal-heads"><span></span>${heads}</div>
          ${rows}
          <div class="cal-legend"><span>Less</span><span class="sw" aria-hidden="true"><i class="lv0"></i><i class="lv1"></i><i class="lv2"></i><i class="lv3"></i><i class="lv4"></i><i class="lv5"></i></span><span>${legend}</span><span class="tip">Gold outline = today · tap a day for its top players, double-tap for every player</span></div>
        </div>
        <aside class="cal-side">${sel}
          <section class="cal-card"><div class="cc-label">BUSIEST DAYS ${cur.current ? 'THIS SEASON' : 'IN SEASON ' + cur.number}</div><div class="cb-list">${busiest || '<p class="note">No PvP yet.</p>'}</div></section>
        </aside>
      </div>`;
  }

  // ---------- season highlights ----------
  const fmtDateY = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  function band(cls, emoji, title, subtitle, total, list, valueOf) {
    const MED = ['🥇', '🥈', '🥉'], PL = ['1ST', '2ND', '3RD'];
    const pod = (i) => {
      const x = list[i];
      if (!x) return `<div class="pod p${i + 1} empty"><div class="medal-big">${MED[i]}</div><div class="val">—</div><div class="step">${PL[i]}</div></div>`;
      return `<div class="pod p${i + 1}"><div class="medal-big">${MED[i]}</div><button class="name-btn" data-id="${x.id}">${esc(x.name)}</button>${rankCell(x.rank)}<div class="val">${valueOf(x)}</div><div class="step">${PL[i]}</div></div>`;
    };
    const rest = list.slice(3).map((x, k) => `<div class="row"><span><span class="p">${k + 4}.</span><button class="name-btn" data-id="${x.id}">${esc(x.name)}</button></span><b>${valueOf(x)}</b></div>`).join('');
    return `<section class="hl-band ${cls}">
      <div class="hl-intro"><div class="hl-emoji" aria-hidden="true">${emoji}</div><h3>${title}</h3><p>${subtitle}</p><p class="total">${total}</p></div>
      <div class="podium">${pod(1)}${pod(0)}${pod(2)}</div>
      <div class="hl-rest">${rest ? `<div class="lbl">ALSO IN THE TOP 5</div>${rest}` : ''}</div>
    </section>`;
  }
  function highlightsHTML() {
    const M = data.latest.members;
    const top5 = (arr, key) => arr.map((x) => [x, key(x)]).filter(([, v]) => v != null && v > 0).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([x]) => x);
    const dmgTotal = M.reduce((t, x) => t + seasonOf(x).dmg, 0);
    const growTotal = M.reduce((t, x) => t + (growth(x) || 0), 0);
    let html = band('hl-dmg', '💥', 'Total damage', 'Most PvP damage this season', `Alliance total: ${fmtT(dmgTotal)}`,
      top5(M, (x) => seasonOf(x).dmg), (x) => fmtT(seasonOf(x).dmg));
    html += band('hl-grow', '📈', 'Overall growth', 'Largest max power gained this season', `Alliance gained ${fmtGrowth(growTotal)}T`,
      top5(M.filter((x) => !isAlt(x) || seasonOf(x).dmg > 0), growth), (x) => fmtGrowth(growth(x)) + 'T');
    html += band('hl-champ', '⚔️', 'Fight like a champ', 'Highest PvP rating this season (damage ÷ max power)', `Alts with no PvP and accounts under ${adjMinT()}T are left out`,
      top5(M.filter((x) => (!isAlt(x) || seasonOf(x).dmg > 0) && x.maxPower >= adjMinT() * 1e12), (x) => seasonOf(x).score), (x) => fmtScore(seasonOf(x).score));
    const W = data.latest.wins;
    if (Array.isArray(W)) {
      const chips = W.map((w, i) => `<div class="win${i === 0 ? ' latest' : ''}"><span aria-hidden="true">🏆</span><span><b>Season ${w.season}</b><small>${fmtDateY(w.date)}</small></span></div>`).join('');
      html += `<section class="hl-wins"><div class="hl-wins-head"><div><div class="hl-emoji" aria-hidden="true">🏆</div><div><h3>BL VICTORIES</h3><p>Every season 5HP has won</p></div></div>
        <div class="hl-count"><b>${W.length}</b><span>season win${W.length === 1 ? '' : 's'}</span></div></div>
        <div class="wins">${chips || '<p class="note">No wins recorded yet.</p>'}</div></section>`;
    }
    return html;
  }

  // The rows a table view shows: rank filters, search, then sort (ties by power).
  function viewRows(V, col, sort) {
    let rows = V.rows().filter((x) => !x.rank || ranks.has(x.rank));
    if (query) rows = rows.filter((x) => x.name.toLowerCase().includes(query));
    return [...rows].sort((a, b) => { const A = col.get(a), B = col.get(b); return (A > B ? 1 : A < B ? -1 : 0) * sort.dir || (b.power || 0) - (a.power || 0); });
  }

  // ---------- CSV export ----------
  const r2 = (v, dp = 2) => (v == null || !isFinite(v) ? '' : Number(v.toFixed(dp)));
  const tT = (v, dp = 2) => (v == null ? '' : r2(v / 1e12, dp));
  function csvCell(v) {
    if (v == null) return '';
    let t = String(v);
    if (typeof v === 'string' && /^[=+\-@]/.test(t)) t = "'" + t;            // keep spreadsheets from reading names as formulas
    return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }
  function downloadCSV(name, header, rows) {
    const text = '﻿' + [header, ...rows].map((r) => r.map(csvCell).join(',')).join('\r\n');   // BOM so Excel reads names correctly
    const url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  const fileBase = () => `${data.latest.alliance.tag}_S${data.latest.season.number}`;
  function exportView() {
    const V = VIEWS[view];
    if (!V || view === 'highlights' || view === 'calendar') return exportAll();
    const sort = sorts[view] || { key: V.def, dir: V.defDir || -1 };
    const col = V.cols.find((c) => c.key === sort.key) || V.cols[0];
    const rows = viewRows(V, col, sort);
    const which = view === 'last' ? 'prev' : 'current';
    const ofN = rows.length && V.cols.some((c) => c.key === 'days') ? fought(rows[0], which).of : '';
    const head = (c) => ({ rank: 'Rank', name: 'Player', power: 'Power (T)', growth: 'Growth this season (T)', seen: 'Last online (days ago)', dmg: 'Damage (T)', days: `Days fought (of ${ofN})` }[c.key] || c.label);
    const val = (c, x) => {
      switch (c.key) {
        case 'rank': return x.rank;
        case 'name': return x.name;
        case 'power': return tT(x.power);
        case 'growth': return r2(growth(x));
        case 'seen': return x.daysOffline;
        case 'dmg': return tT(c.get(x), 1);
        case 'adj': { const v = c.get(x); return v < 0 ? '' : r2(v); }
        case 'days': return c.get(x);
        default: return r2(c.get(x));
      }
    };
    const label = { roster: 'alliance-members', daily: dailyDate ? 'daily-pvp_' + dailyDate : 'daily-pvp_' + data.latest.gameDay, season: 'season-leaderboard', last: 'previous-season_S' + (data.prev?.season ?? '') }[view] || view;
    downloadCSV(`${fileBase()}_${label}_${data.latest.gameDay}.csv`, ['#', ...V.cols.map(head)], rows.map((x, i) => [i + 1, ...V.cols.map((c) => val(c, x))]));
  }
  function exportAll() {
    const L = data.latest;
    const order = (x) => RANKS.indexOf(x.rank);
    const rows = [...L.members].sort((a, b) => order(a) - order(b) || b.power - a.power);
    const header = ['Player', 'ID', 'Rank', 'Alt (R1)', 'Level', 'Power (T)', 'Max power (T)', 'Growth this season (T)', 'Last online', 'Days since online',
      'Damage today (T)', 'Activity today', 'Season damage (T)', 'Season activity', 'Season adjusted', `Days fought (of ${L.season.dayNumber ?? ''})`,
      'PvP total, last 3 seasons (T)', 'Tracked since'];
    downloadCSV(`${fileBase()}_all-player-data_${L.gameDay}.csv`, header, rows.map((x) => {
      const sd = seasonOf(x);
      return [x.name, x.id, x.rank, isAlt(x) ? 'yes' : 'no', x.level, tT(x.power), tT(x.maxPower), r2(growth(x)), x.lastOnline, x.daysOffline,
        tT(x.dailyDmg, 1), r2(x.dailyScore), tT(sd.dmg, 1), r2(sd.score), r2(adjusted(sd.dmg, x.maxPower, x.rank)), fought(x).n,
        tT(Number(x.pvp), 1), x.firstSeen];
    }));
  }

  function render() {
    if (!data.latest) return;
    const V = VIEWS[view];
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.view === view));
    $('#astats-box').innerHTML = statsPanel();
    $('#sec-title').textContent = V.title();
    $('#sec-refresh').textContent = typeof V.refresh === 'function' ? V.refresh() : V.refresh;
    $('#sec-counting').innerHTML = V.counting();
    $('#sec-extra').innerHTML = V.extra();
    const hl = view === 'highlights', cal = view === 'calendar', custom = hl || cal;
    document.querySelector('.controls').hidden = custom;
    document.querySelector('.table-box').hidden = custom;
    $('#highlights').hidden = !hl;
    $('#calendar').hidden = !cal;
    $('#sec-after').innerHTML = !custom && V.after ? V.after() : '';
    if (hl) { $('#highlights').innerHTML = highlightsHTML(); return; }
    if (cal) { $('#calendar').innerHTML = calendarHTML(); return; }
    const sort = sorts[view] || { key: V.def, dir: V.defDir || -1 };
    const col = V.cols.find((c) => c.key === sort.key) || V.cols[0];
    let rows = viewRows(V, col, sort);
    $('#table').dataset.view = view;
    $('#table thead').innerHTML = '<tr><th>#</th>' + V.cols.map((c) => {
      const s = c.key === col.key ? (sort.dir < 0 ? 'descending' : 'ascending') : 'none';
      return `<th aria-sort="${s}"><button data-sort="${c.key}">${c.label}</button></th>`;
    }).join('') + '</tr>';
    const podium = V.medals && (col.key === 'score' || col.key === 'adj' || col.key === 'dmg') && sort.dir < 0 && !query;
    const MED = ['🥇', '🥈', '🥉'], CLS = ['gold', 'silver', 'bronze'];
    $('#table tbody').innerHTML = rows.length ? rows.map((x, i) => {
      const top = podium && i < 3 && col.get(x) > 0;
      return `<tr class="${top ? CLS[i] : ''}"><td class="pos">${top ? `<span class="medal">${MED[i]}</span>` : ''}<span class="n">${i + 1}</span></td>` + V.cols.map((c) => `<td>${c.cell(x)}</td>`).join('') + '</tr>';
    }).join('') : `<tr><td class="empty" colspan="${V.cols.length + 1}">${view === 'last' ? 'No finished season yet.' : 'No players match.'}</td></tr>`;
  }

  // ---------- player panel ----------
  function chart(values, dates, kind, fmt) {
    const W = 420, H = 150, P = { l: 8, r: 54, t: 10, b: 22 };
    const pts = values.map((v, i) => ({ v, i })).filter((p) => p.v != null);
    if (pts.length < 2) return '<p class="note">Builds up as days pass. Check back tomorrow.</p>';
    const vals = pts.map((p) => p.v);
    let lo = kind === 'bar' ? 0 : Math.min(...vals), hi = Math.max(...vals);
    if (hi === lo) { hi = hi * 1.01 + 1; lo = kind === 'bar' ? 0 : lo * 0.99; }
    const n = values.length, iw = W - P.l - P.r, ih = H - P.t - P.b;
    const x = (i) => P.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
    const y = (v) => P.t + ih - ((v - lo) / (hi - lo)) * ih;
    const grid = [lo, (lo + hi) / 2, hi].map((g) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${W - P.r + 6}" y="${y(g) + 4}">${fmt(g)}</text>`).join('');
    const labels = `<text x="${P.l}" y="${H - 6}">${fmtDate(dates[0])}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end">${fmtDate(dates[n - 1])}</text>`;
    let marks;
    if (kind === 'bar') {
      const bw = Math.max(2, iw / n * 0.7);
      marks = pts.map((p) => `<rect x="${x(p.i) - bw / 2}" y="${y(p.v)}" width="${bw}" height="${Math.max(0, y(lo) - y(p.v))}" rx="1.5" fill="var(--violet-strong)"/>`).join('');
    } else {
      const d = pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
      const area = `${d}L${x(pts.at(-1).i).toFixed(1)},${y(lo)}L${x(pts[0].i).toFixed(1)},${y(lo)}Z`;
      const last = pts.at(-1);
      marks = `<path d="${area}" fill="var(--cyan)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--cyan)" stroke-width="2"/><circle cx="${x(last.i)}" cy="${y(last.v)}" r="3.5" fill="var(--cyan)"/>`;
    }
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${grid}${marks}${labels}</svg></div>`;
  }

  // This season's damage split into the rest week and Weeks 1–3, plus the best single day.
  function weekBreakdown(m) {
    const S = data.latest.season;
    if (!S.startedOn) return '';
    const today = data.latest.gameDay, dm = dmgByDate(m.id, m);
    const weeks = [];
    let best = null;
    for (let w = 0; w * 7 < (S.length || 28); w++) {
      let dmg = 0, n = 0, of = 0;
      for (let i = w * 7; i < Math.min(S.length || 28, w * 7 + 7); i++) {
        const d = addDays(S.startedOn, i);
        if (d > today || d < S.countingFrom || excluded.has(d)) continue;
        const v = dm.get(d) || 0;
        of++; dmg += v; if (v > 0) n++;
        if (v > 0 && (!best || v > best.v)) best = { d, v };
      }
      weeks.push({ label: w === 0 ? 'Rest week' : `Week ${w}`, dmg, n, of });
    }
    const top = Math.max(1, ...weeks.map((w) => w.dmg));
    const rows = weeks.map((w) => w.of === 0
      ? `<div class="wk future"><span>${w.label}</span><span class="bar"></span><span>Not started</span></div>`
      : `<div class="wk"><span>${w.label}</span><span class="bar"><i style="width:${Math.round(w.dmg / top * 100)}%"></i></span><span><b>${fmtT(w.dmg)}</b><small>${w.n}/${w.of} days</small></span></div>`).join('');
    const bestTxt = best ? `Best day: <b>${fmtDate(best.d)}</b>, ${fmtT(best.v)}` : 'No damage yet this season.';
    const exTxt = excluded.size ? ` Left-out days aren't counted.` : '';
    return `<div class="chart-title">Damage by week</div><div class="weeks">${rows}</div><p class="note best">${bestTxt}${exTxt}</p>`;
  }

  function openPlayer(id) {
    const L = data.latest;
    const m = L.members.find((x) => String(x.id) === String(id));
    const h = data.history?.players?.[id];
    const days = data.history?.days || [];
    const name = m?.name || h?.n || data.prev?.rows?.find((r) => String(r.id) === String(id))?.name || 'Player';
    const kv = (label, val, sub) => `<div><label>${label}</label><span class="num">${val}</span>${sub ? `<small>${sub}</small>` : ''}</div>`;
    let html = `<button class="x" id="close" aria-label="Close">×</button><h2 id="p-name">${esc(name)}</h2>`;
    if (m) {
      html += `<p class="sub">${rankCell(m.rank)} &nbsp;Level ${(m.level ?? 0).toLocaleString()}</p>`;
      const g = growth(m), f = fought(m);
      html += `<div class="kv">${kv('Power', tNum(m.power) + 'T')}${kv('Peak power', tNum(m.maxPower) + 'T', g == null ? '' : fmtGrowth(g) + 'T this season')}${kv('Today', fmtT(m.dailyDmg), 'Activity ' + fmtScore(m.dailyScore) + ' · Adjusted ' + fmtAdj(adjusted(m.dailyDmg, m.maxPower, m.rank)))}${kv('This season', fmtT(m.seasonDmg), 'Activity ' + fmtScore(m.seasonScore) + ' · Adjusted ' + fmtAdj(adjusted(m.seasonDmg, m.maxPower, m.rank)))}${kv('PvP total', fmtT(Number(m.pvp)), 'last 3 seasons')}${kv('Last online', m.daysOffline === 0 ? 'Today' : (m.daysOffline ?? '—') + ' days ago')}${kv('Days fought', `${f.n} of ${f.of}`, 'this season')}</div>`;
      html += weekBreakdown(m);
    } else {
      html += '<p class="note">No longer in the alliance.</p>';
    }
    if (h && days.length) {
      const N = Math.min(days.length, 60), s = days.length - N;
      const pDays = days.slice(s), pPow = h.p.slice(s), pDmg = h.d.slice(s);
      if (m) { pDays.push(L.gameDay); pPow.push(m.maxPower); }
      html += `<div class="chart-title">Max power (T)</div>${chart(pPow, pDays, 'line', (v) => tNum(v))}`;
      html += `<div class="chart-title">PvP damage per day</div>${chart(pDmg, days.slice(s), 'bar', (v) => compact(v, 1))}`;
    } else {
      html += '<p class="note">Daily history starts after the first full day of tracking.</p>';
    }
    if (m) html += `<p class="note" style="margin-top:18px"><a href="https://kg.dbapp.ru/character/${m.id}" target="_blank" rel="noopener">Open on KG Companion</a></p>`;
    const dr = $('#drawer'); dr.innerHTML = html; dr.hidden = false; $('#scrim').hidden = false;
    $('#close').focus();
  }
  const closePlayer = () => { $('#drawer').hidden = true; $('#scrim').hidden = true; };

  // ---------- events ----------
  const setView = (v) => { if (!VIEWS[v]) v = 'roster'; view = v; try { history.replaceState(null, '', '#' + v); } catch {} render(); };
  document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-view]'); if (!b) return; if (b.dataset.view === 'daily') dailyDate = null; setView(b.dataset.view); });
  const syncChips = () => document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', ranks.has(c.dataset.rank)));
  $('#rank-chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const r = b.dataset.rank; ranks.has(r) ? ranks.delete(r) : ranks.add(r);
    if (!ranks.size) RANKS.forEach((x) => ranks.add(x));
    syncChips(); store.set('ranks', [...ranks]); render();
  });
  const exportMenu = $('#export-menu'), exportBtn = $('#export-btn');
  const closeExport = () => { exportMenu.hidden = true; exportBtn.setAttribute('aria-expanded', 'false'); };
  exportBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = exportMenu.hidden;
    exportMenu.hidden = !open; exportBtn.setAttribute('aria-expanded', String(open));
    if (open) exportMenu.querySelector('button').focus();
  });
  exportMenu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-export]'); if (!b) return;
    closeExport();
    b.dataset.export === 'all' ? exportAll() : exportView();
  });
  document.addEventListener('click', (e) => { if (!exportMenu.hidden && !e.target.closest('.export')) closeExport(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !exportMenu.hidden) { closeExport(); exportBtn.focus(); } });
  $('#q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); render(); });
  $('#highlights').addEventListener('click', (e) => { const n = e.target.closest('.name-btn'); if (n) openPlayer(n.dataset.id); });
  $('#sec-extra').addEventListener('click', (e) => {
    const b = e.target.closest('[data-day-nav]'); if (!b) return;
    if (b.dataset.dayNav === 'today') { dailyDate = null; render(); } else moveDay(Number(b.dataset.dayNav));
  });
  $('#calendar').addEventListener('dblclick', (e) => {
    const d = e.target.closest('[data-cal-day]'); if (!d) return;
    dailyDate = d.dataset.calDay === data.latest.gameDay ? null : d.dataset.calDay; setView('daily');
  });
  $('#calendar').addEventListener('click', (e) => {
    const n = e.target.closest('.name-btn'); if (n) { openPlayer(n.dataset.id); return; }
    const s = e.target.closest('[data-cal-season]'); if (s) { calSeason = Number(s.dataset.calSeason); calDay = null; render(); return; }
    const h = e.target.closest('[data-cal-shade]'); if (h) { calShade = h.dataset.calShade; render(); return; }
    const o = e.target.closest('[data-open-day]'); if (o) { dailyDate = o.dataset.openDay === data.latest.gameDay ? null : o.dataset.openDay; setView('daily'); window.scrollTo({ top: document.querySelector('.tabs').offsetTop - 10 }); return; }
    const d = e.target.closest('[data-cal-day]'); if (d) { if (d.dataset.calDay === calDay && e.detail === 2) return; calDay = d.dataset.calDay; render(); }
  });
  $('#table').addEventListener('click', (e) => {
    const s = e.target.closest('button[data-sort]');
    if (s) {
      const V = VIEWS[view], cur = sorts[view] || { key: V.def, dir: V.defDir || -1 };
      const c = V.cols.find((x) => x.key === s.dataset.sort);
      sorts[view] = cur.key === c.key ? { key: c.key, dir: -cur.dir } : { key: c.key, dir: c.asc ? 1 : -1 };
      store.set('sorts3', sorts); render(); return;
    }
    const n = e.target.closest('.name-btn'); if (n) openPlayer(n.dataset.id);
  });
  const toggleDay = (el) => {
    const d = el.dataset.day;
    if (!d) return;
    excluded.has(d) ? excluded.delete(d) : excluded.add(d);
    seasonCache = new Map();
    store.set(exclKey(), [...excluded]);
    render();
  };
  $('#sec-extra').addEventListener('click', (e) => {
    if (e.target.closest('[data-reset]')) { excluded = new Set(); seasonCache = new Map(); store.set(exclKey(), []); render(); return; }
    const el = e.target.closest('.day[data-day]'); if (el) toggleDay(el);
  });
  $('#sec-extra').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const el = e.target.closest('.day[data-day]'); if (el) { e.preventDefault(); toggleDay(el); }
  });
  $('#drawer').addEventListener('click', (e) => { if (e.target.id === 'close') closePlayer(); });
  $('#scrim').addEventListener('click', closePlayer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlayer(); });

  // Old links (#inactive, #changes) fall back to the roster.
  syncChips();
  setView((location.hash || '').slice(1) || 'roster');
  load();
  setInterval(load, 5 * 60 * 1000);
})();

// Google Translate language picker. If it can't load, the page works without it.
window.googleTranslateElementInit = function () {
  try { new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element'); } catch (e) {}
};
(function () {
  const s = document.createElement('script');
  s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
  s.async = true;
  document.head.appendChild(s);
})();
</script>
