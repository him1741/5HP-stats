<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>5HP Alliance Stats</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: slim brand bar → season heading → rank filter + tabs → one section per tab (title, formula panel, season calendar, ledger table). Dark only, to match RISE. */
:root {
  --bg: #0f1226;
  --bar: #151a33;
  --panel: #161b36;
  --panel-2: #1c2244;
  --line: #2a3160;
  --ink: #eef0fa;
  --ink-2: #b9bfdc;
  --muted: #8a91b8;
  --violet: #a99cf5;
  --violet-strong: #8a78f0;
  --cyan: #7fd3f7;
  --chip: #1d2a55;
  --chip-line: #3b5bb5;
  --chip-ink: #9ec3ff;
  --gold: #f6c94c; --silver: #d9dde8; --bronze: #ef8a3c;
  --r5-bg: #3a2463; --r5: #d0b4ff;
  --r4-bg: #1d3566; --r4: #8fbaff;
  --r3-bg: #183d2c; --r3: #7fdc9f;
  --r2-bg: #173a40; --r2: #7fd6d6;
  --r1-bg: #2a2f45; --r1: #b9bfd6;
  --day-on: #1f5a34; --day-on-line: #3fa765; --day-on-ink: #c9f5d7;
  --day-off: #1a1f3a; --today: #f6c94c;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }

/* Brand bar */
.topbar { background: var(--bar); border-bottom: 1px solid var(--line); }
.topbar .wrap { padding-block: 14px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.brand b { display: block; font-size: 20px; font-weight: 600; color: var(--cyan); letter-spacing: .02em; line-height: 1.1; }
.brand span { display: block; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
#google_translate_element { min-height: 28px; }
#google_translate_element select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: 15px var(--font); }
.goog-te-gadget { color: var(--muted) !important; font-size: 0 !important; }
.goog-te-gadget > span { display: none; }

/* Season heading */
.head { padding-block: 26px 6px; }
.head h1 { margin: 0; font-size: clamp(26px, 5vw, 32px); font-weight: 700; line-height: 1.15; text-wrap: balance; }
.head h1 small { font-size: 17px; font-weight: 400; color: var(--ink-2); margin-left: 10px; white-space: nowrap; }
.meta { margin-top: 6px; color: var(--muted); font-size: 14.5px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.meta b { color: var(--ink-2); font-weight: 600; }
.demo { margin-top: 14px; padding: 10px 14px; border: 1px solid #6b5a1e; background: #2a2410; color: #f3e3a8; border-radius: 10px; font-size: 14.5px; }

/* Filters + tabs */
.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-top: 20px; }
.show { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.show > span { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin-right: 4px; }
.chip { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; min-width: 50px; padding: 5px 12px; font: 600 15px/1.2 var(--font); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--chip); border-color: var(--chip-line); color: var(--chip-ink); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 28px; margin-top: 22px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 2px; font: 600 15px/1.2 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--violet); cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--violet-strong); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* Section */
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-top: 26px; }
.section-head h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #dcd6ff; }
.section-head .refresh { font-size: 14px; font-style: italic; color: var(--muted); }
.counting { margin: 4px 0 0; color: var(--ink-2); font-size: 15px; }
.formula { margin-top: 16px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 14px 16px; }
.formula code { display: block; font: 600 16px/1.4 var(--mono); color: var(--cyan); margin-bottom: 6px; }
.formula p { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 72ch; }
.search { display: block; flex: 1 1 220px; max-width: 320px; }
.search input { width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: 16px var(--font); }
.search input::placeholder { color: var(--muted); }

/* Season calendar */
.cal { margin-top: 18px; }
.cal-title { font-size: 15.5px; color: var(--ink); margin-bottom: 10px; }
.cal-title b { color: var(--day-on-ink); }
.cal-row { display: grid; grid-template-columns: minmax(0, 190px) auto; align-items: center; gap: 10px; margin-bottom: 7px; }
.cal-row > span { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--violet); }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.day { width: 34px; height: 30px; display: grid; place-items: center; border-radius: 6px; font-size: 14px; font-variant-numeric: tabular-nums; border: 1px solid var(--line); color: var(--muted); background: var(--day-off); }
.day.on { background: var(--day-on); border-color: var(--day-on-line); color: var(--day-on-ink); }
.day.future { background: transparent; border-style: dashed; }
.day.today { outline: 2px solid var(--today); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1px solid var(--line); background: var(--day-off); }
.legend i.on { background: var(--day-on); border-color: var(--day-on-line); }
@media (max-width: 560px) { .cal-row { grid-template-columns: 1fr; gap: 4px; } }

/* Table */
.table-box { margin-top: 18px; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 13px 16px; text-align: left; white-space: nowrap; }
th { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--violet); background: var(--panel-2); border-bottom: 1px solid var(--line); }
th button { all: unset; cursor: pointer; }
th[aria-sort="descending"] button::after { content: " ▼"; font-size: 10px; }
th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 10px; }
td { font-size: 16px; color: var(--ink); }
tbody tr + tr { border-top: 1px solid var(--line); }
tbody tr:hover { background: var(--panel-2); }
td.pos { width: 1%; color: var(--ink-2); }
.medal { display: block; font-size: 17px; line-height: 1; margin-bottom: 2px; }
tr.gold .name-btn, tr.gold .pw { color: var(--gold); }
tr.silver .name-btn, tr.silver .pw { color: var(--silver); }
tr.bronze .name-btn, tr.bronze .pw { color: var(--bronze); }
.rank { display: inline-block; min-width: 34px; text-align: center; font-size: 13px; font-weight: 700; line-height: 1; padding: 5px 7px; border-radius: 5px; }
.rank.R5 { background: var(--r5-bg); color: var(--r5); } .rank.R4 { background: var(--r4-bg); color: var(--r4); }
.rank.R3 { background: var(--r3-bg); color: var(--r3); } .rank.R2 { background: var(--r2-bg); color: var(--r2); }
.rank.R1 { background: var(--r1-bg); color: var(--r1); }
.name-btn { all: unset; cursor: pointer; font-weight: 500; }
.rank.mini { display: none; }
.name-btn:hover { text-decoration: underline; }
.dmg { color: var(--muted); margin-left: 6px; }
.seen-ok { color: var(--r3); } .seen-warn { color: #f0b45a; } .seen-bad { color: #ff8a80; }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); white-space: normal; }
@media (max-width: 560px) {
  th, td { padding: 11px 5px; }
  .rank { min-width: 30px; padding: 5px 5px; }
  th { font-size: 11.5px; letter-spacing: .04em; }
  td { font-size: 15px; }
  th:first-child, td:first-child { padding-left: 12px; }
  .dmg { display: block; margin: 0; font-size: 12px; letter-spacing: -.01em; }
  .pos .medal { font-size: 17px; margin: 0; }
  .pos .medal + .n { display: none; }
  th:nth-child(2), td:nth-child(2) { display: none; }
  .rank.mini { display: inline-block; min-width: 0; font-size: 11px; padding: 3px 4px; margin-right: 6px; vertical-align: 1px; }
  th { white-space: normal; vertical-align: bottom; }
  .tabs { gap: 0 18px; }
}
footer { color: var(--muted); font-size: 14px; padding-block: 26px 36px; }
footer a { color: var(--ink-2); }

/* Player panel */
.scrim { position: fixed; inset: 0; background: rgb(4 6 16 / .6); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 21; overflow-y: auto;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 20px; }
.drawer h2 { margin: 0 44px 0 0; font-size: 26px; line-height: 1.15; overflow-wrap: anywhere; }
.drawer .x { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 8px; width: 36px; height: 36px; font-size: 20px; cursor: pointer; }
.drawer .sub { color: var(--ink-2); font-size: 15px; margin: 8px 0 0; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin: 18px 0 4px; }
.kv div { min-width: 0; }
.kv label { display: block; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--violet); }
.kv span { font-size: 19px; font-weight: 600; }
.kv small { display: block; color: var(--muted); font-size: 13.5px; }
.chart-title { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--violet); margin: 22px 0 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--font); }
.drawer .note { color: var(--muted); font-size: 14.5px; }
.drawer a { color: var(--chip-ink); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>
<!--ARTIFACT-HEAD-END-->
</head>
<body>
<!--ARTIFACT-BODY-START-->
<header class="topbar">
  <div class="wrap">
    <div class="brand"><b id="brand-tag">5HP</b><span id="brand-sub">Stats · KG 1737</span></div>
    <div id="google_translate_element"></div>
  </div>
</header>

<main class="wrap">
  <section class="head">
    <h1><span id="season-name">Season —</span><small id="season-week"></small></h1>
    <div class="meta"><span id="updated">Loading…</span><span id="alliance-line"></span></div>
    <div class="demo" id="demo-banner" hidden>Preview: the roster is real (pulled Oct 22). Daily and season damage are simulated so you can see how the tables fill in once tracking runs.</div>
  </section>


  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-view="roster" id="tab-roster">Master roster</button>
    <button role="tab" data-view="daily" id="tab-daily">Daily PvP</button>
    <button role="tab" data-view="season" id="tab-season">Season leaderboard</button>
    <button role="tab" data-view="last" id="tab-last">Previous season</button>
  </nav>

  <div class="section-head"><h2 id="sec-title"></h2><span class="refresh" id="sec-refresh"></span></div>
  <p class="counting" id="sec-counting"></p>
  <div id="sec-extra"></div>
  <div class="controls">
    <div class="show" id="rank-chips" aria-label="Show ranks">
      <span>Show:</span>
      <button class="chip" data-rank="R5" aria-pressed="true">R5</button>
      <button class="chip" data-rank="R4" aria-pressed="true">R4</button>
      <button class="chip" data-rank="R3" aria-pressed="true">R3</button>
      <button class="chip" data-rank="R2" aria-pressed="true">R2</button>
      <button class="chip" data-rank="R1" aria-pressed="true">R1</button>
    </div>
    <label class="search"><input id="q" type="search" placeholder="Find a player" aria-label="Find a player"></label>
  </div>
  <div class="table-box"><table id="table"><thead></thead><tbody></tbody></table></div>
</main>

<footer class="wrap">
  Data from <a href="https://kg.dbapp.ru/" target="_blank" rel="noopener">KG Companion</a>. Days run 00:00–24:00 UTC. Tap a player's name for their history.
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="p-name"></aside>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const RANKS = ['R5', 'R4', 'R3', 'R2', 'R1'];
  const store = {
    get(k, d) { try { const v = localStorage.getItem('kgstats:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('kgstats:' + k, JSON.stringify(v)); } catch {} },
  };

  // ---------- formatting ----------
  const SUF = [[1e18, 'Qi'], [1e15, 'Qa'], [1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
  const compact = (n, dp = 2) => {
    if (n == null || !isFinite(n)) return '—';
    const a = Math.abs(n);
    for (const [v, s] of SUF) if (a >= v) return (n / v).toFixed(a / v >= 100 ? 1 : dp) + s;
    return Math.round(n).toLocaleString();
  };
  const tNum = (n) => (n / 1e12).toFixed(2);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ago = (iso) => {
    const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60); if (h < 48) return h + ' h ago';
    return Math.round(h / 24) + ' days ago';
  };
  const utcStamp = (iso) => iso.slice(0, 16).replace('T', ' ') + ' UTC';
  const fmtDate = (d) => d ? new Date(d + (d.length === 10 ? 'T00:00:00Z' : '')).toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' }) : '—';
  const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 86400e3).toISOString().slice(0, 10);

  // ---------- state ----------
  let data = { latest: null, history: null, changes: [], prev: null };
  let view = 'roster';
  const ranks = new Set(store.get('ranks', RANKS));
  let query = '';
  const sorts = store.get('sorts2', {});

  const bust = () => '?t=' + Math.floor(Date.now() / 60000);
  const getJson = async (f, d) => { try { const r = await fetch('data/' + f + bust()); if (!r.ok) return d; return await r.json(); } catch { return d; } };

  async function load() {
    const [latest, history, changes, prev] = await Promise.all([
      getJson('latest.json', null), getJson('history.json', null), getJson('changes.json', []), getJson('prev-season.json', null),
    ]);
    if (!latest) { $('#updated').textContent = 'No data yet. The first update runs within 15 minutes of setup.'; return; }
    data = { latest, history, changes: changes || [], prev };
    renderHeader(); render();
  }

  function renderHeader() {
    const L = data.latest, A = L.alliance, S = L.season;
    $('#brand-tag').textContent = A.tag;
    $('#brand-sub').textContent = `Stats · KG ${A.server}`;
    document.title = `${A.tag} Alliance Stats`;
    $('#season-name').textContent = `Season ${S.number ?? '—'}`;
    $('#season-week').textContent = S.week == null ? '' : (S.week === 0 ? `Rest week · Day ${S.day}` : `Week ${S.week} · Day ${S.day}`);
    $('#updated').innerHTML = `Last updated: <b>${utcStamp(L.fetchedAt)}</b> (${ago(L.fetchedAt)})`;
    $('#alliance-line').textContent = `[${A.tag}] ${A.name} · ${A.members}${A.maxMembers ? '/' + A.maxMembers : ''} members · ${compact(A.power)} power`;
    $('#demo-banner').hidden = !L.demo;
  }

  // ---------- pieces ----------
  const rankCell = (r) => `<span class="rank ${esc(r)}">${esc(r || '—')}</span>`;
  const nameCell = (x) => `<span class="rank mini ${esc(x.rank)}">${esc(x.rank)}</span><button class="name-btn" data-id="${x.id}">${esc(x.name)}</button>`;
  const powerCell = (x) => `<span class="pw">${tNum(x.power)}</span>`;
  const fmtScore = (s) => (s ?? 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtT = (n) => ((n ?? 0) / 1e12).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + 'T';
  const scoreCell = (s, d) => `<b>${fmtScore(s)}</b><span class="dmg">(${fmtT(d)})</span>`;
  const seen = (d) => d == null ? '—' : d === 0 ? '<span class="seen-ok">Today</span>' : d < 3 ? `<span class="seen-ok">${d}d ago</span>` : d < 7 ? `<span class="seen-warn">${d}d ago</span>` : `<span class="seen-bad">${d}d ago</span>`;
  const formulaBox = () => `<div class="formula"><code>Activity = PvP Damage ÷ Max Power</code><p>The same activity score the game and KG Companion use. Dividing by a player's highest power lets big and small accounts be compared fairly: a higher score means more fighting for their size. Damage is shown in brackets.</p></div>`;

  function calendar() {
    const S = data.latest.season;
    if (!S.startedOn) return '';
    const today = data.latest.gameDay, counted = new Set(S.daysCounted || []);
    const rows = [];
    for (let w = 0; w * 7 < S.length; w++) {
      const days = [];
      for (let i = w * 7; i < Math.min(S.length, w * 7 + 7); i++) {
        const d = addDays(S.startedOn, i);
        const cls = d > today ? 'future' : counted.has(d) ? 'on' : '';
        days.push(`<span class="day ${cls}${d === today ? ' today' : ''}" title="${fmtDate(d)}">${Number(d.slice(8))}</span>`);
      }
      const label = w === 0 ? `Rest week (days 1–7)` : `Week ${w} (days ${w * 7 + 1}–${w * 7 + 7})`;
      rows.push(`<div class="cal-row"><span>${label}</span><div class="days">${days.join('')}</div></div>`);
    }
    const n = counted.size, sofar = S.dayNumber || 0;
    return `<div class="cal"><div class="cal-title">📅 <b>${n} of ${sofar}</b> days counted this season</div>${rows.join('')}
      <div class="legend"><span><i class="on"></i>Counted</span><span><i></i>Before tracking began</span><span>Gold outline = today</span></div></div>`;
  }

  // ---------- views ----------
  const base = [
    { key: 'rank', label: 'Rank', get: (x) => RANKS.indexOf(x.rank), cell: (x) => rankCell(x.rank) },
    { key: 'name', label: 'Player', get: (x) => x.name.toLowerCase(), cell: nameCell, asc: true },
    { key: 'power', label: 'Power (T)', get: (x) => x.power, cell: powerCell },
  ];
  const VIEWS = {
    roster: {
      title: () => `Season ${data.latest.season.number} Master Roster`,
      refresh: 'Refreshes every ~15 minutes',
      counting: () => `${data.latest.members.length} members in [${esc(data.latest.alliance.tag)}] right now.`,
      extra: () => '',
      rows: () => data.latest.members,
      cols: [...base, { key: 'seen', label: 'Last online', get: (x) => -(x.daysOffline ?? 999), cell: (x) => seen(x.daysOffline) }],
      def: 'power', medals: false,
    },
    daily: {
      title: () => 'Daily PvP',
      refresh: 'Refreshes every ~15 minutes',
      counting: () => `Counting from ${data.latest.gameDay} 00:00 UTC`,
      extra: formulaBox,
      rows: () => data.latest.members,
      cols: [...base, { key: 'score', label: 'Activity (Damage)', get: (x) => x.dailyScore, cell: (x) => scoreCell(x.dailyScore, x.dailyDmg) }],
      def: 'score', medals: true,
    },
    season: {
      title: () => `Season ${data.latest.season.number} Leaderboard`,
      refresh: 'Refreshes every ~15 minutes',
      counting: () => {
        const S = data.latest.season;
        return `Counting from ${S.countingFrom} 00:00 UTC` + (S.partial ? ` · tracking started part-way through this season` : '');
      },
      extra: () => formulaBox() + calendar(),
      rows: () => data.latest.members,
      cols: [...base, { key: 'score', label: 'Total Activity (Damage)', get: (x) => x.seasonScore, cell: (x) => scoreCell(x.seasonScore, x.seasonDmg) }],
      def: 'score', medals: true,
    },
    last: {
      title: () => data.prev ? `Season ${data.prev.season} Final Leaderboard` : 'Previous Season Leaderboard',
      refresh: 'Updates at season rollover',
      counting: () => data.prev ? `Counted ${data.prev.from} to ${data.prev.to}` : 'This fills in automatically when the current season ends.',
      extra: () => data.prev ? formulaBox() : '',
      rows: () => data.prev?.rows || [],
      cols: [...base, { key: 'score', label: 'Total Activity (Damage)', get: (x) => x.score, cell: (x) => scoreCell(x.score, x.dmg) }],
      def: 'score', medals: true,
    },
  };

  function render() {
    if (!data.latest) return;
    const V = VIEWS[view];
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.view === view));
    $('#sec-title').textContent = V.title();
    $('#sec-refresh').textContent = V.refresh;
    $('#sec-counting').innerHTML = V.counting();
    $('#sec-extra').innerHTML = V.extra();
    const sort = sorts[view] || { key: V.def, dir: -1 };
    const col = V.cols.find((c) => c.key === sort.key) || V.cols[0];
    let rows = V.rows().filter((x) => !x.rank || ranks.has(x.rank));
    if (query) rows = rows.filter((x) => x.name.toLowerCase().includes(query));
    rows = [...rows].sort((a, b) => { const A = col.get(a), B = col.get(b); return (A > B ? 1 : A < B ? -1 : 0) * sort.dir; });
    $('#table thead').innerHTML = '<tr><th>#</th>' + V.cols.map((c) => {
      const s = c.key === col.key ? (sort.dir < 0 ? 'descending' : 'ascending') : 'none';
      return `<th aria-sort="${s}"><button data-sort="${c.key}">${c.label}</button></th>`;
    }).join('') + '</tr>';
    const podium = V.medals && col.key === 'score' && sort.dir < 0 && !query;
    const MED = ['🥇', '🥈', '🥉'], CLS = ['gold', 'silver', 'bronze'];
    $('#table tbody').innerHTML = rows.length ? rows.map((x, i) => {
      const top = podium && i < 3 && col.get(x) > 0;
      return `<tr class="${top ? CLS[i] : ''}"><td class="pos">${top ? `<span class="medal">${MED[i]}</span>` : ''}<span class="n">${i + 1}</span></td>` + V.cols.map((c) => `<td>${c.cell(x)}</td>`).join('') + '</tr>';
    }).join('') : `<tr><td class="empty" colspan="${V.cols.length + 1}">${view === 'last' ? 'No finished season yet.' : 'No players match.'}</td></tr>`;
  }

  // ---------- player panel ----------
  function chart(values, dates, kind, fmt) {
    const W = 420, H = 150, P = { l: 8, r: 54, t: 10, b: 22 };
    const pts = values.map((v, i) => ({ v, i })).filter((p) => p.v != null);
    if (pts.length < 2) return '<p class="note">Builds up as days pass. Check back tomorrow.</p>';
    const vals = pts.map((p) => p.v);
    let lo = kind === 'bar' ? 0 : Math.min(...vals), hi = Math.max(...vals);
    if (hi === lo) { hi = hi * 1.01 + 1; lo = kind === 'bar' ? 0 : lo * 0.99; }
    const n = values.length, iw = W - P.l - P.r, ih = H - P.t - P.b;
    const x = (i) => P.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
    const y = (v) => P.t + ih - ((v - lo) / (hi - lo)) * ih;
    const grid = [lo, (lo + hi) / 2, hi].map((g) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${W - P.r + 6}" y="${y(g) + 4}">${fmt(g)}</text>`).join('');
    const labels = `<text x="${P.l}" y="${H - 6}">${fmtDate(dates[0])}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end">${fmtDate(dates[n - 1])}</text>`;
    let marks;
    if (kind === 'bar') {
      const bw = Math.max(2, iw / n * 0.7);
      marks = pts.map((p) => `<rect x="${x(p.i) - bw / 2}" y="${y(p.v)}" width="${bw}" height="${Math.max(0, y(lo) - y(p.v))}" rx="1.5" fill="var(--violet-strong)"/>`).join('');
    } else {
      const d = pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
      const area = `${d}L${x(pts.at(-1).i).toFixed(1)},${y(lo)}L${x(pts[0].i).toFixed(1)},${y(lo)}Z`;
      const last = pts.at(-1);
      marks = `<path d="${area}" fill="var(--cyan)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--cyan)" stroke-width="2"/><circle cx="${x(last.i)}" cy="${y(last.v)}" r="3.5" fill="var(--cyan)"/>`;
    }
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${grid}${marks}${labels}</svg></div>`;
  }

  function openPlayer(id) {
    const L = data.latest;
    const m = L.members.find((x) => String(x.id) === String(id));
    const h = data.history?.players?.[id];
    const days = data.history?.days || [];
    const name = m?.name || h?.n || data.prev?.rows?.find((r) => String(r.id) === String(id))?.name || 'Player';
    const kv = (label, val, sub) => `<div><label>${label}</label><span class="num">${val}</span>${sub ? `<small>${sub}</small>` : ''}</div>`;
    let html = `<button class="x" id="close" aria-label="Close">×</button><h2 id="p-name">${esc(name)}</h2>`;
    if (m) {
      html += `<p class="sub">${rankCell(m.rank)} &nbsp;Level ${(m.level ?? 0).toLocaleString()}</p>`;
      html += `<div class="kv">${kv('Power', tNum(m.power) + 'T')}${kv('Peak power', tNum(m.maxPower) + 'T')}${kv('Today', fmtT(m.dailyDmg), 'Activity ' + fmtScore(m.dailyScore))}${kv('This season', fmtT(m.seasonDmg), 'Activity ' + fmtScore(m.seasonScore))}${kv('PvP total (KG Companion)', fmtT(Number(m.pvp)))}${kv('Last online', m.daysOffline === 0 ? 'Today' : (m.daysOffline ?? '—') + ' days ago')}</div>`;
    } else {
      html += '<p class="note">No longer in the alliance.</p>';
    }
    if (h && days.length) {
      const N = Math.min(days.length, 60), s = days.length - N;
      const pDays = days.slice(s), pPow = h.p.slice(s), pDmg = h.d.slice(s);
      if (m) { pDays.push(L.gameDay); pPow.push(m.power); }
      html += `<div class="chart-title">Power (T)</div>${chart(pPow, pDays, 'line', (v) => tNum(v))}`;
      html += `<div class="chart-title">PvP damage per day</div>${chart(pDmg, days.slice(s), 'bar', (v) => compact(v, 1))}`;
    } else {
      html += '<p class="note">Daily history starts after the first full day of tracking.</p>';
    }
    if (m) html += `<p class="note" style="margin-top:18px"><a href="https://kg.dbapp.ru/character/${m.id}" target="_blank" rel="noopener">Open on KG Companion</a></p>`;
    const dr = $('#drawer'); dr.innerHTML = html; dr.hidden = false; $('#scrim').hidden = false;
    $('#close').focus();
  }
  const closePlayer = () => { $('#drawer').hidden = true; $('#scrim').hidden = true; };

  // ---------- events ----------
  const setView = (v) => { if (!VIEWS[v]) v = 'roster'; view = v; try { history.replaceState(null, '', '#' + v); } catch {} render(); };
  document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view); });
  const syncChips = () => document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', ranks.has(c.dataset.rank)));
  $('#rank-chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const r = b.dataset.rank; ranks.has(r) ? ranks.delete(r) : ranks.add(r);
    if (!ranks.size) RANKS.forEach((x) => ranks.add(x));
    syncChips(); store.set('ranks', [...ranks]); render();
  });
  $('#q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); render(); });
  $('#table').addEventListener('click', (e) => {
    const s = e.target.closest('button[data-sort]');
    if (s) {
      const V = VIEWS[view], cur = sorts[view] || { key: V.def, dir: -1 };
      const c = V.cols.find((x) => x.key === s.dataset.sort);
      sorts[view] = cur.key === c.key ? { key: c.key, dir: -cur.dir } : { key: c.key, dir: c.asc ? 1 : -1 };
      store.set('sorts2', sorts); render(); return;
    }
    const n = e.target.closest('.name-btn'); if (n) openPlayer(n.dataset.id);
  });
  $('#drawer').addEventListener('click', (e) => { if (e.target.id === 'close') closePlayer(); });
  $('#scrim').addEventListener('click', closePlayer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlayer(); });

  // Old links (#inactive, #changes) fall back to the roster.
  syncChips();
  setView((location.hash || '').slice(1) || 'roster');
  load();
  setInterval(load, 5 * 60 * 1000);
})();

};
(function () {
  const s = document.createElement('script');
  s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
  s.async = true;
  document.head.appendChild(s);
})();
</script>
